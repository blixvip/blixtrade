<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080c">
<title>Meme Radar</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/"><img src="/icon.svg" alt="" width="30" height="30"><span>Meme Radar</span></a>
    <nav class="tabs" id="tabs">
      <a href="#/" data-r=""><svg viewBox="0 0 24 24"><path d="M2 12h5l3-7 4 14 3-7h5"/></svg><span>Pulse</span><em class="live-em">LIVE</em></a>
      <a href="#/signals" data-r="signals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/></svg><span>Signals</span></a>
      <a href="#/picks" data-r="picks"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg><span>Picks</span><em>AI</em></a>
      <a href="#/research" data-r="research"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Research</span></a>
      <a href="#/narratives" data-r="narratives"><svg viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5 5 9.5A5 5 0 0 1 7 12.5c0-2 1-3.2 2-4 0 2 1 3 2 3 0-3-1-5.5 1-8.5z"/></svg><span>Narratives</span></a>
      <a href="#/coins" data-r="coins"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg><span>Coins</span></a>
      <a href="#/wallets" data-r="wallets"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg><span>Wallets</span></a>
      <a href="#/briefs" data-r="briefs"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M14 3v5h5"/></svg><span>Briefs</span></a>
      <a href="#/record" data-r="record"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Track record</span></a>
      <a href="#/health" data-r="health"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/><path d="M8 12h2l1.5-2.5 2 5L15 12h1.5"/></svg><span>Health</span></a>
      <a href="#/settings" data-r="settings" class="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></a>
    </nav>
    <div class="live" id="live"><i></i><span>connecting</span></div>
  </aside>
  <div class="content">
    <div class="tape" id="tape" aria-label="Top movers"></div>
    <div class="strip" id="strip"></div>
    <main id="main"><div class="boot"><div class="skel big"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
  </div>
</div>
<aside class="drawer" id="drawer" hidden>
  <div class="scrim" data-close></div>
  <section class="panel" id="panel" role="dialog" aria-modal="true"></section>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
