<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Blix</title>
<script>
// Every file and read this page asks for is relative ("assets/…", "api/…"). Opened at a deeper address (/app/, with
// a slash, or /app/anything) those resolved under it and came back as this page instead: a blank screen. The
// address is put back to its first part before anything is loaded; the page's routes live after the #.
(function () {
  try {
    var parts = location.pathname.split("/").filter(Boolean);
    var clean = "/" + (parts[0] || "");
    if (location.pathname !== clean) history.replaceState(history.state, "", clean + location.search + location.hash);
  } catch (e) {}
})();
</script>
<link rel="icon" href="brand/favicon.png?v=eye2" type="image/png" sizes="192x192">
<link rel="icon" href="favicon.ico?v=eye2" sizes="any">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png?v=eye2">
<style>
/* The loading screen (#boot below), drawn with the HTML before any script: Blix's chrome wordmark arrives out of a
   soft blur, a light crosses the chrome every couple of seconds, a slow glow breathes behind it and a thin bar runs
   under it. The wordmark is shown through a luminance mask of itself (its black backdrop vanishes on any colour) and
   the light goes through the same mask, so only the chrome is lit. When the app has drawn its first frame the
   screen fades and lifts away (the script after it); colours are the page's own (src/styles/app.css). */
html,body{height:100%;margin:0;background:oklch(18% 0 0)}
.blix-load{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#boot{position:fixed;inset:0;z-index:2147483000;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 46%,oklch(21% 0 0) 0%,oklch(16.5% 0 0) 55%,oklch(13% 0 0) 100%);
  transition:opacity .5s cubic-bezier(.16,1,.3,1),visibility .5s}
.blix-load .b-glow{position:absolute;left:50%;top:46%;width:min(560px,120vw);aspect-ratio:1;translate:-50% -50%;border-radius:50%;
  background:radial-gradient(closest-side,oklch(100% 0 0/.075),oklch(100% 0 0/.02) 55%,transparent);filter:blur(18px);animation:b-glow 3.6s ease-in-out infinite}
.blix-load .b-mark{position:relative;width:min(232px,56vw);aspect-ratio:600/260;
  -webkit-mask:url(brand/blix-chrome.webp) center/100% 100% no-repeat;mask:url(brand/blix-chrome.webp) luminance center/100% 100% no-repeat;
  animation:b-in 1s cubic-bezier(.16,1,.3,1) both;transition:transform .5s cubic-bezier(.16,1,.3,1),filter .5s}
.blix-load .b-mark::before{content:"";position:absolute;inset:0;background:url(brand/blix-chrome.webp) center/100% 100% no-repeat}
.blix-load .b-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,oklch(100% 0 0/.18) 45%,oklch(100% 0 0/.95) 50%,oklch(100% 0 0/.18) 55%,transparent 62%) no-repeat;
  background-size:260% 100%;animation:b-sheen 2.6s cubic-bezier(.45,0,.25,1) .55s infinite}
.blix-load .b-bar{position:relative;width:104px;height:2px;border-radius:2px;overflow:hidden;background:oklch(100% 0 0/.08);animation:b-fade .7s .45s cubic-bezier(.16,1,.3,1) both}
.blix-load .b-bar i{position:absolute;inset:0 auto 0 0;width:42%;border-radius:2px;background:linear-gradient(90deg,transparent,oklch(100% 0 0/.9),transparent);animation:b-run 1.3s cubic-bezier(.65,0,.35,1) infinite}
#boot.out{opacity:0;visibility:hidden}
#boot.out .b-mark{transform:scale(1.06);filter:blur(6px)}
@keyframes b-in{from{opacity:0;transform:translateY(8px) scale(.94);filter:blur(12px)}}
@keyframes b-sheen{from{background-position:135% 0}to{background-position:-35% 0}}
@keyframes b-glow{0%,100%{opacity:.55;scale:.92}50%{opacity:1;scale:1.05}}
@keyframes b-run{from{translate:-110% 0}to{translate:250% 0}}
@keyframes b-fade{from{opacity:0;transform:scaleX(.4)}}
@media (prefers-reduced-motion:reduce){.blix-load *,.blix-load *::before,.blix-load *::after{animation:none!important}.blix-load .b-bar i{translate:70% 0}}
</style>
<script>
// The reads the page on screen makes, started now, before its scripts have loaded. src/lib/api.ts remembers them
// per page (the first word of the address; a coin's own address stands as {m}) and picks these answers up.
(function () {
  try {
    performance.mark("blix:html");
    var at = location.hash.replace(/^#\/?/, "").split("?")[0].split("/");
    // The open page's own code (vite.config.ts fills the list in at build), fetched beside the entry script.
    (/*BLIX_PAGE_FILES*/{}[at[0] || ""] || []).forEach(function (f) { var l = document.createElement("link"); l.rel = "modulepreload"; l.crossOrigin = ""; l.href = "/" + f; document.head.appendChild(l); });
    var list = JSON.parse(localStorage.getItem("blix:warm:" + (at[0] || "home")) || "[]"), warm = (window.__blixWarm = {});
    // On blixvip.com reads go straight to the server (src/lib/api.ts, the direct line), with the member cookie.
    var direct = /^(www\.|trade\.)?blixvip\.com$/.test(location.hostname), base = direct ? "https://origin.blixvip.com/" : "";
    var ask = function (path, init) { init = init || {}; if (direct) init.credentials = "include"; return fetch(base + path, init); };
    // The connection to the server now (DNS, TLS: ~0.2 s), so the first logos and reads do not each wait for it.
    if (direct) { var pre = document.createElement("link"); pre.rel = "preconnect"; pre.href = base; document.head.appendChild(pre); }
    // The logos of the list this page showed last time (src/lib/pics.ts), in one request.
    var logos = at[1] || !/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? [] : JSON.parse(localStorage.getItem("blix:warm:pics:" + (at[0] || "home")) || "[]");
    // The faces this page drew in its first moments last time (src/lib/thumb.ts noteFace), loading beside the scripts.
    (JSON.parse(localStorage.getItem("blix:warm:faces:" + (at[0] || "home")) || "[]") || []).slice(0, 40).forEach(function (u) { if (typeof u !== "string" || !/^(https:|\/api\/pic)/.test(u)) return; var l = document.createElement("link"); l.rel = "preload"; l.as = "image"; l.href = u; document.head.appendChild(l); });
    if (logos.length) window.__blixPics = ask("api/pics?m=" + logos.slice(0, 80).join(",")).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    list.slice(0, 16).forEach(function (raw) {
      var path = String(raw);
      if (path === "market" && !matchMedia("(min-width: 768px)").matches) return;
      if (path.indexOf("{m}") >= 0) { if (!at[1]) return; path = path.split("{m}").join(at[1]); }
      var t = performance.now();
      // _k (kept, a query parameter so the direct line needs no OPTIONS trip): the page server's kept answer will do if it is under a minute old (server/apicache.js); the
      // page asks again as soon as it has drawn.
      var asked = (warm[path] = ask("api/" + path + (path.indexOf("?") >= 0 ? "&" : "?") + "_k=5000").then(function (r) {
        if (!r.ok) throw 0;
        return r.json().then(function (data) { var got = { data: data, age: +r.headers.get("x-blix-age") || 0, t: t }; if (warm[path] === asked) warm[path] = got; return got; });
      }).catch(function () { if (warm[path] === asked) delete warm[path]; return null; }));
    });
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="root"></div>
<div id="boot" class="blix-load" role="status" aria-label="Loading Blix"><span class="b-glow"></span><span class="b-mark"></span><span class="b-bar"><i></i></span></div>
<script>
// Lift the loading screen once the app has drawn: when React has put something in #root that is not itself still
// loading (a page showing the same wordmark loader, components/page.tsx BrandLoader, keeps this one up instead, so
// there is one loader, never two in a row), two frames later (painted by then), after at least a short beat so the
// wordmark is not a flash. Fifteen seconds at most whatever happens.
(function () {
  var boot = document.getElementById("boot"), root = document.getElementById("root"), t0 = Date.now(), gone = false;
  if (!boot || !root) return;
  function lift() {
    if (gone) return; gone = true;
    setTimeout(function () {
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        boot.className = "out";
        setTimeout(function () { boot.remove(); }, 600);
      }); });
    }, Math.max(0, 420 - (Date.now() - t0)));
  }
  var ready = function () { return root.firstElementChild && !root.querySelector("[data-brand-loader]"); };
  if (ready()) return lift();
  var watch = new MutationObserver(function () { if (ready()) { watch.disconnect(); lift(); } });
  watch.observe(root, { childList: true, subtree: true });
  setTimeout(lift, 15000);
})();
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
