<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · BLIX</title><meta name="robots" content="noindex"><meta name="theme-color" content="#050608">
<link rel="icon" href="/_pub/icon.svg" type="image/svg+xml">
<link rel="preload" href="/_pub/fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:400 700;font-display:swap;src:url(/_pub/fonts/inter-tight.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 500;font-display:swap;src:url(/_pub/fonts/jetbrains-mono.woff2) format('woff2')}
:root{--bg:#050608;--card:#0a0c10;--card2:#0d1015;--line:#161a21;--line2:#1f242d;--text:#f4f6fa;--soft:#cfd6e4;--mute:#8a92a3;--dim:#5d6575;--green:#22d38a;--green-bg:rgba(34,211,138,.12);--amber:#ffb020;--amber-bg:rgba(255,176,32,.1);--red:#ff6b7a;--red-bg:rgba(255,107,122,.12);--blue:#7aa7ff;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(176,182,194,.09),transparent 70%),var(--bg);color:var(--text);font:14px/1.45 "Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:20px clamp(16px,3vw,36px) 60px}
/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand img{height:26px}.brand b{font-weight:600;font-size:18px;letter-spacing:-.02em}.brand span{color:var(--dim);font-size:13px;border-left:1px solid var(--line2);padding-left:10px}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;color:var(--mute);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.status.ok i{background:var(--green);animation:ping 2s infinite}.status.ok{color:var(--soft)}
.status.warn{border-color:rgba(255,176,32,.35);color:#ffd88a}.status.warn i{background:var(--amber)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,211,138,.6)}70%{box-shadow:0 0 0 7px rgba(34,211,138,0)}100%{box-shadow:0 0 0 0 rgba(34,211,138,0)}}
.grow{flex:1}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;cursor:pointer;color:var(--mute);font-size:13px;font-weight:500}
.seg button.on{background:#f2f3f5;color:#0a0b0d}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);padding:7px 13px;border-radius:999px;cursor:pointer;color:var(--soft);font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#2c323d;color:var(--text)}
.check{display:inline-flex;align-items:center;gap:7px;color:var(--mute);font-size:13px;cursor:pointer;user-select:none}
.check input{accent-color:var(--green)}
/* banner */
.banner{display:none;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,176,32,.3);background:var(--amber-bg);color:#ffe2a8;margin-bottom:16px;font-size:13.5px}
.banner.show{display:flex}.banner b{color:#fff}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:12px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px}
.kpi{padding:16px 18px;min-width:0}
.kpi .l{color:var(--mute);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .v{font:500 30px/1.15 var(--mono);margin-top:8px;letter-spacing:-.02em}
.kpi .s{color:var(--dim);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font:500 12px var(--mono);margin-left:auto;padding:1px 7px;border-radius:999px}
.d.up{color:var(--green);background:var(--green-bg)}.d.down{color:var(--red);background:var(--red-bg)}
.faces{display:flex;margin-top:8px;min-height:22px}.faces .av{width:22px;height:22px;margin-right:-6px;border:2px solid var(--card);font-size:9px}
/* chart */
.chart{padding:16px 18px 10px;margin-bottom:12px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.head h2{font-size:13px;font-weight:600;color:var(--soft);letter-spacing:.01em}
.head .n{color:var(--dim);font-size:12.5px}
.legend{display:flex;gap:14px;color:var(--mute);font-size:12px;margin-left:auto}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg{display:block;width:100%}
.tip{position:fixed;pointer-events:none;background:#12161c;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--soft);display:none;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tip b{color:var(--text)}
/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.box{padding:16px 18px;min-width:0}
/* people table */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:7px 13px;width:220px;outline:none}
.search:focus{border-color:#3a414d}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:none;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--mute);cursor:pointer}
.chip.on{border-color:#3a414d;color:var(--text);background:#141820}
.chip em{font-style:normal;color:var(--dim);margin-left:4px;font-family:var(--mono);font-size:11px}
.tbl{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;min-width:900px}
th{text-align:left;color:var(--dim);font-weight:500;font-size:12px;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--soft)}th.on{color:var(--text)}
td{padding:10px 10px;border-bottom:1px solid #101318;font-size:13.5px;color:var(--soft);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .6s}
tbody tr:hover{background:#0d1015}
tr.flash{background:rgba(34,211,138,.1)}
td.m{color:var(--mute)}td.num{font-family:var(--mono);font-size:12.5px;color:var(--mute)}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.who div{min-width:0}.who b{display:block;font-weight:500;color:var(--text);max-width:220px;overflow:hidden;text-overflow:ellipsis}.who small{display:block;color:var(--mute);font-size:12.5px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.av{position:relative;flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#0a0b0d;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--card)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;font-weight:500}
.tag.you{background:#1b2130;color:var(--blue)}.tag.new{background:var(--green-bg);color:var(--green)}.tag.held{background:var(--amber-bg);color:var(--amber)}.tag.rec{background:#1b1f27;color:var(--mute)}
.pill{border:0;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer}
.pill.on{background:var(--green-bg);color:var(--green)}.pill.on:hover{background:var(--red-bg);color:var(--red)}
.pill.off{background:var(--red-bg);color:var(--red)}.pill.off:hover{background:var(--green-bg);color:var(--green)}
.pill.na{background:#141820;color:var(--dim);cursor:default}
.on-now{color:var(--green)}
.empty{color:var(--dim);padding:18px 0;text-align:center;font-size:13px}
/* feed */
.feed{display:grid;grid-template-columns:minmax(0,1fr);max-height:560px;overflow-y:auto;margin:0 -8px;padding:0 8px}
.fi{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:11px;align-items:center;padding:9px 6px;border-bottom:1px solid #101318;border-radius:10px;transition:background .6s}
.fi.flash{background:rgba(34,211,138,.1)}
.fi .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#141820;color:var(--mute);font-size:13px}
.fi .ic.sg{background:var(--green-bg);color:var(--green)}.fi .ic.fail{background:var(--red-bg);color:var(--red)}.fi .ic.bot{background:#141414;color:#555}
.fi .tx{min-width:0;font-size:13px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .tx b{color:var(--text);font-weight:500}.fi .tx code{font-family:var(--mono);font-size:12px;color:var(--text);background:#141820;padding:1px 6px;border-radius:6px}
.fi .tx small{display:block;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.fi time{color:var(--dim);font-size:12px;font-family:var(--mono)}
/* breakdowns */
.bd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.row{position:relative;display:flex;justify-content:space-between;gap:10px;padding:6px 9px;border-radius:8px;font-size:13px;overflow:hidden}
.row i{position:absolute;left:0;top:0;bottom:0;background:#141922;border-radius:8px;z-index:0}
.row span,.row b{position:relative;z-index:1}.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.row b{font:500 12px var(--mono);color:var(--mute)}
.note{color:var(--dim);font-size:12px;margin-top:10px}
.foot{color:var(--dim);font-size:12px;margin-top:18px;text-align:center}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:24px}.bd{grid-template-columns:minmax(0,1fr)}.search{width:100%}.legend{margin-left:0}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/"><img src="/_pub/home/bx-logo.webp" alt=""><b>BLIX</b><span>Admin</span></a>
    <div class="status" id="status"><i></i><span>Connecting…</span></div>
    <div class="grow"></div>
    <label class="check" title="Leave out page views from your own accounts and devices"><input type="checkbox" id="mine"> Include my visits</label>
    <div class="seg" id="range"><button data-r="1">24 h</button><button data-r="7" class="on">7 days</button><button data-r="30">30 days</button></div>
    <a class="btn" href="/__admin.csv">Export CSV</a>
  </div>
  <div class="banner" id="banner"></div>

  <div class="kpis">
    <div class="card kpi"><div class="l">New sign-ups <span class="d" id="k-su-d"></span></div><div class="v" id="k-su">–</div><div class="s" id="k-su-s"></div></div>
    <div class="card kpi"><div class="l">Online now</div><div class="v" id="k-on">–</div><div class="faces" id="k-on-f"></div></div>
    <div class="card kpi"><div class="l">Visitors <span class="d" id="k-vi-d"></span></div><div class="v" id="k-vi">–</div><div class="s" id="k-vi-s"></div></div>
    <div class="card kpi"><div class="l">Visitor → sign-up</div><div class="v" id="k-cv">–</div><div class="s" id="k-cv-s"></div></div>
    <div class="card kpi"><div class="l">Members active</div><div class="v" id="k-ac">–</div><div class="s" id="k-ac-s"></div></div>
  </div>

  <div class="card chart">
    <div class="head"><h2>Traffic</h2><span class="n" id="chart-n"></span>
      <div class="legend"><span><i style="background:#3b4250"></i>Visitors</span><span><i style="background:var(--green)"></i>Sign-ups</span></div></div>
    <svg id="chart" height="190" aria-label="Visitors and sign-ups over time"></svg>
  </div>

  <div class="card box" style="margin-bottom:12px">
    <div class="head"><h2>People</h2><span class="n" id="ppl-n"></span><div class="grow"></div>
      <div class="tools"><div class="chips" id="chips"></div><input class="search" id="q" type="search" placeholder="Search name, email, place…"></div></div>
    <div class="tbl"><table><thead><tr>
      <th class="s" data-k="name">Person</th><th>Access</th><th class="s on" data-k="created">Joined ↓</th><th class="s" data-k="seen">Last seen</th>
      <th class="s" data-k="logins">Logins</th><th class="s" data-k="views">Page views</th><th>Location</th><th>Came from</th></tr></thead>
      <tbody id="ppl"></tbody></table></div>
  </div>

  <div class="cols">
    <div class="card box">
      <div class="head"><h2>Live activity</h2><span class="n" id="feed-n"></span><div class="grow"></div>
        <label class="check"><input type="checkbox" id="bots"> Show bots</label></div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="bd">
      <div class="card box"><div class="head"><h2>Sources</h2></div><div class="list" id="b-src"></div></div>
      <div class="card box"><div class="head"><h2>Countries</h2></div><div class="list" id="b-cty"></div></div>
      <div class="card box"><div class="head"><h2>Pages</h2></div><div class="list" id="b-pg"></div></div>
      <div class="card box"><div class="head"><h2>Devices</h2></div><div class="list" id="b-dev"></div><div class="note" id="b-note"></div></div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>
<div class="tip" id="tip"></div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var H = 3600000, D = 86400000;
  // Scanners probing for WordPress, PHP, config files and the like: every visitor that asks for one is a bot.
  var JUNK = /\.(php\d?|aspx?|jsp|cgi|env|git|sql|bak|old|zip|tar|gz|rar|7z|ini|ya?ml|log|sh|py|rb|pl|swp|conf|config|db|sqlite|ds_store)(\/|$)|^\/(wp-|wordpress|\.|cgi-bin|phpmyadmin|pma|myadmin|vendor\/|xmlrpc|owa|ecp|autodiscover|actuator|solr|boaform|hudson|jenkins|manager\/|druid|console|HNAP1|setup|admin\/|administrator|backup|bk\/|old\/|new\/|test\/|tmp\/|server-status|telescope|_ignition|api\/v1\/pods|remote\/|sitemap\.xml\.gz)/i;
  var OWN = /(^|\.)blixvip\.com$|^accounts\.google\.|^localhost/i;
  var S = { ev: [], seen: {}, acc: {}, owners: {}, pending: [], health: { db: true }, range: 7, mine: false, bots: false, chip: "all", q: "", sort: "created", desc: true, since: 0, lastOk: 0, stale: false, firstLoad: true, fresh: 0, botVis: {}, ownerVis: {} };
  try { var r0 = +localStorage.getItem("blixadm:range"); if ([1, 7, 30].indexOf(r0) >= 0) S.range = r0; S.mine = localStorage.getItem("blixadm:mine") === "1"; } catch (e) {}

  var regionName = (function () { try { var n = new Intl.DisplayNames(["en"], { type: "region" }); return function (c) { try { return n.of(c); } catch (e) { return c; } }; } catch (e) { return function (c) { return c; }; } })();
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return n == null ? "–" : n >= 10000 ? (n / 1000).toFixed(1) + "k" : String(n); }
  function ago(t) { var s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 45 ? "just now" : s < 3600 ? Math.max(1, Math.round(s / 60)) + "m ago" : s < 86400 ? Math.floor(s / 3600) + "h ago" : s < 86400 * 30 ? Math.floor(s / 86400) + "d ago" : new Date(t).toLocaleDateString(); }
  function when(t) { return new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  function place(country, city) { if (!country && !city) return ""; var c = country ? regionName(country) : ""; return city ? city + (c ? ", " + c : "") : c; }
  var HUES = [158, 210, 265, 330, 20, 45, 190, 290];
  function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return HUES[Math.abs(h) % HUES.length]; }
  function initials(name, email) { var b = (name || email || "?").replace(/@.*/, "").trim().split(/[\s._-]+/); return ((b[0] || "?")[0] + (b[1] ? b[1][0] : "")).toUpperCase(); }
  function avatar(a, online, size) {
    var bg = "hsl(" + hue(a.email || "") + " 55% 72%)";
    var img = a.picture && /^https:\/\/lh3\.googleusercontent\.com\//.test(a.picture) ? '<img alt="" loading="lazy" src="/__admin/pic?u=' + encodeURIComponent(a.picture) + '">' : "";
    return '<span class="av" style="background:' + bg + (size ? ";width:" + size + "px;height:" + size + "px" : "") + '">' + esc(initials(a.name, a.email)) + img + (online ? '<span class="dot"></span>' : "") + "</span>";
  }
  // A broken picture falls back to the initials under it (error events do not bubble: caught on the way down).
  document.addEventListener("error", function (e) { if (e.target && e.target.tagName === "IMG" && e.target.parentNode && e.target.parentNode.classList.contains("av")) e.target.remove(); }, true);

  function source(ref) {
    if (!ref) return null;
    var host = String(ref).split("/")[0].toLowerCase(), raw = String(ref);
    if (!/\./.test(host)) return raw;                       // ?ref= / utm tag as given
    if (OWN.test(host)) return null;
    var h = host.replace(/^www\.|^m\.|^l\.|^lm\./, "");
    if (/^google\./.test(h)) return "Google";
    if (h === "t.co" || h === "x.com" || h === "twitter.com") return "X (Twitter)";
    if (/threads\.(net|com)$/.test(h)) return "Threads";
    if (/(^|\.)reddit\.com$/.test(h)) return "Reddit";
    if (/(^|\.)youtube\.com$|^youtu\.be$/.test(h)) return "YouTube";
    if (/(^|\.)tiktok\.com$/.test(h)) return "TikTok";
    if (/(^|\.)(facebook|fb)\.com$/.test(h)) return "Facebook";
    if (/(^|\.)instagram\.com$/.test(h)) return "Instagram";
    if (/(^|\.)discord(app)?\.com$/.test(h)) return "Discord";
    if (h === "github.com") return "GitHub";
    if (/(^|\.)bing\.com$/.test(h)) return "Bing";
    if (/(^|\.)duckduckgo\.com$/.test(h)) return "DuckDuckGo";
    if (/(^|\.)linkedin\.com$|^lnkd\.in$/.test(h)) return "LinkedIn";
    if (/(^|\.)telegram\.(org|me)$|^t\.me$/.test(h)) return "Telegram";
    if (/chatgpt\.com$|openai\.com$/.test(h)) return "ChatGPT";
    if (/perplexity\.ai$/.test(h)) return "Perplexity";
    return h;
  }

  // ---- data ----
  function unpack(o) {
    var d = o.dict || [], g = function (i) { return i < 0 ? null : d[i]; };
    return (o.ev || []).map(function (r) { return { id: r[0], t: r[1], kind: g(r[2]), path: g(r[3]), email: r[4], visitor: g(r[5]), country: g(r[6]), city: g(r[7]), referrer: g(r[8]), device: g(r[9]), detail: r[10] }; });
  }
  function addEvent(e) {
    if (S.seen[e.id]) return false;
    S.seen[e.id] = 1; S.ev.push(e);
    if (e.visitor && (e.device === "bot" || (e.path && JUNK.test(e.path)))) S.botVis[e.visitor] = 1;
    if (e.email && S.owners[e.email] && e.visitor) S.ownerVis[e.visitor] = 1;
    return true;
  }
  function setAccount(a) {
    var old = S.acc[a.email], isNew = !old && !S.firstLoad;
    S.acc[a.email] = Object.assign(old || {}, a);
    if (S.owners[a.email] && a.visitor) S.ownerVis[a.visitor] = 1;
    return isNew;
  }
  function isBot(e) { return e.device === "bot" || (e.visitor && S.botVis[e.visitor]) || (e.path && JUNK.test(e.path)); }
  function isMine(e) { return (e.email && S.owners[e.email]) || (e.visitor && S.ownerVis[e.visitor]); }
  function human(e) { return !isBot(e) && (S.mine || !isMine(e)); }

  // ---- render ----
  function bounds() {
    var now = Date.now(), n = S.range, start;
    if (n === 1) { var h = new Date(now); h.setMinutes(0, 0, 0); start = h.getTime() - 23 * H; return { now: now, from: now - D, start: start, step: "h", count: 24 }; }
    var d0 = new Date(now); d0.setHours(0, 0, 0, 0);
    var s = new Date(d0); s.setDate(s.getDate() - (n - 1));
    return { now: now, from: s.getTime(), start: s.getTime(), step: "d", count: n };
  }
  function bucketOf(t, b) {
    if (b.step === "h") return Math.floor((t - b.start) / H);
    var d = new Date(t); d.setHours(0, 0, 0, 0);
    return Math.round((d.getTime() - b.start) / D);

    [].forEach.call(this.querySelectorAll("th.s"), function (h) { h.classList.toggle("on", h === th); h.textContent = h.textContent.replace(/ [↑↓]$/, "") + (h === th ? (S.desc ? " ↓" : " ↑") : ""); });
    renderPeople(bounds());
  });
  $("ppl").addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button.pill"); if (!b) return;
    var em = b.getAttribute("data-email"), to = b.getAttribute("data-to");
    if (to === "blocked" && !confirm("Pause " + em + "? They'll be kept out of the terminal until you let them back in.")) return;
    b.disabled = true;
    var body = new URLSearchParams({ email: em, status: to });
    fetch("/__admin/status", { method: "POST", body: body, credentials: "same-origin", redirect: "manual" }).then(function () { if (S.acc[em]) S.acc[em].status = to; renderPeople(bounds()); }).catch(function () { b.disabled = false; alert("That didn't go through. Try again."); });
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { S.fresh = 0; poll(); } });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { renderChart(bounds()); }, 150); });
  setInterval(function () { [].forEach.call(document.querySelectorAll("time[data-t]"), function (el) { el.textContent = ago(+el.getAttribute("data-t")); }); renderStatus(); }, 5000);
  setInterval(poll, 4000);
  setInterval(function () { if (!document.hidden) load(true); }, 5 * 60000);
  load(false).then(poll);
})();
</script>
